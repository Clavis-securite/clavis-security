<!DOCTYPE html>

<html lang="fr">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width,initial-scale=1" name="viewport"/>
<title>Clavis — Application</title>
<meta content="noindex" name="robots"/>
<link href="/manifest.webmanifest" rel="manifest"/>
<meta content="#0ea5e9" name="theme-color"/>
<meta content="yes" name="apple-mobile-web-app-capable"/>
<meta content="black-translucent" name="apple-mobile-web-app-status-bar-style"/>
<link href="/assets/icons/icon-192.png" rel="icon" sizes="192x192" type="image/png"/>
<link href="/assets/icons/icon-192.png" rel="apple-touch-icon"/>
<link href="/css/styles.css" rel="stylesheet"/>
<script defer="" src="/js/app-mode.js"></script>
<script defer="" src="/js/pwa.js"></script>
<!-- Supabase (pour savoir si on ouvre directement le coffre) -->
<script defer="" src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script defer="" src="/js/supabase.js"></script>
<script defer="">
    (function () {
      function isStandalone() {
        return (
          (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches) ||
          window.navigator.standalone === true
        );
      }

      function isPhoneLike() {
        const w = Math.min(window.innerWidth || 0, (screen && screen.width) ? screen.width : 9999);
        const small = w <= 900;
        const coarse = window.matchMedia ? window.matchMedia('(pointer: coarse)').matches : true;
        return small && coarse;
      }

      async function boot() {
        // Si quelqu’un ouvre /app.html dans un navigateur normal : on renvoie vers le site web.
        // Ou si c'est une PWA sur desktop/tablette : on garde le site web.
        if (!isStandalone() || !isPhoneLike()) {
          window.location.replace('/index.html');
          return;
        }

        // En mode app : si déjà connecté => coffre, sinon connexion.
        try {
          // supabase.js expose getSession()
          if (typeof window.getSession === 'function') {
            const session = await window.getSession();
            window.location.replace(session ? '/dashboard.html' : '/login.html');
            return;
          }
        } catch (_) {}

        window.location.replace('/login.html');
      }

      window.addEventListener('load', boot);
    })();
  </script>
<style>
    /* Mini écran d'attente ultra léger */
    html, body { height: 100%; }
    body {
      display: grid;
      place-items: center;
      margin: 0;
      background: #0b1220;
      color: rgba(255,255,255,.9);
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
    }
    .splash {
      width: min(420px, 92vw);
      padding: 18px;
      border: 1px solid rgba(255,255,255,.10);
      border-radius: 16px;
      background: rgba(255,255,255,.04);
      text-align: center;
    }
    .logo {
      width: 56px;
      height: 56px;
      border-radius: 14px;
      margin: 0 auto 12px;
      display: block;
    }
    .t { font-weight: 700; font-size: 18px; margin: 0 0 6px; }
    .s { opacity: .8; font-size: 14px; margin: 0; }
  </style>
</head>
<body>
<div aria-live="polite" class="splash" role="status">
<img alt="" class="logo" src="/assets/icons/icon-192.png"/>
<p class="t">Clavis</p>
<p class="s">Ouverture…</p>
</div>
</body>
</html>
